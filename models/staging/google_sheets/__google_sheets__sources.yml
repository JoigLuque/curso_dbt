sources:
  - name: google_sheets
    description: Base de datos de Google Sheets
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: { count: 24, period: hour }
        error_after: { count: 48, period: hour }
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: google_sheets
    tables:
      - name: budget
        description: Presupuesto
        columns:
          - name: _row
            description: numero de fila del presupuesto
          - name: product_id
            description: ID del producto
          - name: quantity
            description: cantidad del producto
          - name: month
            description: mes del presupuesto
          - name: _fivetran_synced
            description: fecha sincronizacion fivetran
          - name: _loaded_at
            description: fecha ultima carga
